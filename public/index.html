<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Citizen Complaint Portal</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h2>Citizen Complaint Portal</h2>
        <p>Government of India</p>
    </header>

    <main class="welcome">

        <div class="intro">
            <h1>Welcome</h1>
            <p>Register and submit your complaints related to government services.</p>
            <p>You can also track the status of your complaints online.</p>
        </div>

        <div class="login-box">
            <h2>Citizen Login</h2>

            <form id="loginForm">

                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >

                <button type="submit">Login</button>

            </form>

            <p class="register-text">
                New user?
                <a href="register.html">Register here</a>
            </p>

        </div>

    </main>

    <footer>
        <p>© 2026 Citizen Complaint Portal</p>
    </footer>

    <script src="index.js"></script>

</body>
</html>
