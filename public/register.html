<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Citizen Complaint Portal</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h2>Citizen Complaint Portal</h2>
        <p>Government of India</p>
    </header>

    <main class="welcome">

        <div class="intro">
            <h1>Register</h1>
            <p>Create a new account to submit and track your complaints.</p>
        </div>

        <div class="login-box">

            <h2>Create Account</h2>

            <form>

                <label>Full Name</label>
                <input type="text" placeholder="Enter your full name" id="name" required>

                <label>Email</label>
                <input type="email" placeholder="Enter your email" id="email" required>

                <label>Password</label>
                <input type="password" placeholder="Enter your password" id="password" required>

                <label>Confirm Password</label>
                <input type="password" placeholder="Confirm your password" id="confirmPassword" required>

                <button type="submit">Register</button>

            </form>

            <p class="register-text">
                Already have an account?
                <a href="index.html">Login here</a>
            </p>

        </div>

    </main>

    <script src="register.js"></script>

</body>

</html>
